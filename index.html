.cli-status{display:block;text-align:center;border-radius:5px;padding:.23em .28em;font-size:9px;font-weight:900;color:#fff}
.cli-status.red{border:1px solid #c3221a;background:linear-gradient(#d9271a,#760904)}
.cli-status.blue{border:1px solid #1a91d2;background:linear-gradient(#139be2,#075783)}
.cli-status.green{border:1px solid #75bd1a;background:linear-gradient(#6cab16,#315d08)}
.cli-status.orange{border:1px solid #e08b10;background:linear-gradient(#ce770d,#743c00)}
.cli-status.gray{border:1px solid #888;background:linear-gradient(#656b68,#2c302e)}

.cli-detail{
  position:absolute;z-index:30;left:61.1%;top:13.3%;width:37.5%;height:64.6%;
  background:rgba(2,9,6,.992);border:1px solid #4a5a32;border-radius:7px;overflow-y:auto;overflow-x:hidden;
  padding:1.45% 1.55%;font:600 11px/1.22 "Arial Narrow",Arial,sans-serif;
  scrollbar-width:thin;scrollbar-color:#76a91c #06100c;
}
.cli-detail .dhead{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;border-bottom:1px solid #2b3d2e;padding-bottom:10px;margin-bottom:8px}
.cli-detail .avatar{width:54px;height:54px;border:2px solid #709d25;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(#273824,#0c160d)}
.cli-detail .dname{color:#fff;font-size:22px;font-weight:900;line-height:1.05}
.cli-detail .dtype{color:#b7c1b9;margin-top:4px}
.cli-detail .badge-ok{display:inline-block;margin-top:6px;color:#96e72c;border:1px solid #4c7d11;background:#142406;border-radius:5px;padding:3px 7px;font-weight:900}
.cli-detail .sec{color:#9dde31;font-size:12px;font-weight:900;text-transform:uppercase;margin:10px 0 5px;border-top:1px solid #223126;padding-top:8px}
.cli-detail .line{display:grid;grid-template-columns:18px 1fr;gap:6px;margin:4px 0;color:#edf1ed}
.cli-detail .ico{color:#8edb1a}
.cli-detail .muted{color:#9aa49d}
.cli-detail .cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cli-detail .card{border:1px solid #2f442e;border-radius:6px;padding:7px;background:rgba(4,14,10,.88)}
.cli-detail .big{font-size:19px;color:#a4e834;font-weight:900}
.cli-detail .locations{padding-left:3px}
.cli-detail .loc{margin:6px 0;padding-left:3px;border-left:2px solid #668e16}

.cli-legend{
  position:absolute;z-index:31;left:1.45%;top:69.1%;width:58.55%;height:7.5%;
  background:rgba(2,9,6,.985);border:1px solid #354435;border-radius:6px;padding:1.2% 1.5%;
  font:700 10px/1.5 "Arial Narrow",Arial,sans-serif;color:#dce3dc;
}
.cli-legend b{display:block;margin-bottom:5px}.cli-legend span{margin-right:12px;white-space:nowrap}
.cli-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.cli-legend .red{background:#e31616}.cli-legend .blue{background:#098bd2}.cli-legend .green{background:#67aa0b}.cli-legend .orange{background:#d47a08}.cli-legend .gray{background:#7b807d}

/* Formularz klienta: utrzymujemy zatwierdzoną grafikę 1:1 w dużej przestrzeni roboczej.
   Nie jest już skalowana do szerokości telefonu. */
.cli-form-v13 .form-back{
  position:absolute;z-index:50;right:1.3%;top:1.0%;border:1px solid #72b61c;border-radius:7px;
  background:rgba(3,13,8,.95);color:#fff;font:900 15px/1 Arial,sans-serif;padding:10px 14px;
}
.client-simple-modal{
  position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;
}
.client-simple-card{
  width:min(92vw,560px);max-height:88vh;overflow:auto;background:linear-gradient(#0c1112,#07100b);
  border:1px solid #6f8f18;border-radius:16px;color:#fff;box-shadow:0 0 30px rgba(139,214,0,.25);padding:18px;
  font-family:Arial,Helvetica,sans-serif;
}
.client-simple-card h3{margin:0 0 14px;color:#a8e51a}
.client-simple-card input,.client-simple-card select,.client-simple-card textarea,.client-simple-card button{
  width:100%;min-height:46px;border-radius:9px;border:1px solid #5d7520;background:#0b100d;color:#fff;
  font-size:16px;padding:9px 11px;margin:5px 0;
}
.client-simple-card button{font-weight:800}.client-simple-card .green{background:linear-gradient(#6db900,#347a00)}
.client-simple-card .orange{background:linear-gradient(#b86f00,#704000)}
.client-simple-card .red{background:linear-gradient(#a10000,#5d0000)}

/* ===== V14 — ŻYWY FORMULARZ KLIENTA, CZYTELNOŚĆ JAK DOSTAWCY V12 ===== */
.cli-form-live{
  position:relative;width:941px;min-width:941px;margin:0;background:#020705;color:#f4f7f3;
  font-family:"Arial Narrow","Roboto Condensed","Noto Sans Condensed",Arial,sans-serif;
}
.cli-form-master-head{
  position:relative;width:941px;height:190px;overflow:hidden;background:#020705;border-bottom:1px solid #283a28;
}
.cli-form-master-head img{
  position:absolute;left:0;top:0;width:941px;height:auto;display:block;user-select:none;-webkit-user-drag:none;
}
.cli-form-head-back{
  position:absolute;z-index:55;right:13px;top:13px;min-width:150px;height:42px;border:1px solid #79c91c;
  border-radius:8px;background:rgba(2,12,7,.96);color:#fff;font:900 14px/1 Arial,sans-serif;
}
.cli-form-title{
  padding:13px 16px 5px;color:#9ce226;font-size:24px;font-weight:900;letter-spacing:.2px;
}
.cli-form-sub{padding:0 16px 12px;color:#9ba69f;font-size:12px}
.cli-form-body{padding:0 14px 16px}
.cli-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.cli-form-panel{
  border:1px solid #41532d;border-radius:9px;background:linear-gradient(180deg,#07100c 0%,#020806 100%);
  padding:13px;box-shadow:inset 0 0 0 1px rgba(133,184,45,.04);
}
.cli-form-panel.full{grid-column:1/-1}
.cli-form-panel h3{
  margin:0 0 11px;color:#9ce226;font-size:17px;line-height:1.1;font-weight:900;text-transform:uppercase;
  border-bottom:1px solid #253728;padding-bottom:8px;
}
.cli-form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cli-form-row.three{grid-template-columns:1fr 1fr 1fr}
.cli-form-field{margin:0 0 10px}
.cli-form-field label{display:block;color:#cbd3cd;font-size:12px;font-weight:800;margin:0 0 4px}
.cli-form-field label.req:after{content:" *";color:#f1a417}
.cli-form-input,.cli-form-select,.cli-form-textarea{
  width:100%;box-sizing:border-box;border:1px solid #3f532d;border-radius:7px;background:#060c09;color:#fff;
  font:700 15px/1.2 "Arial Narrow",Arial,sans-serif;outline:none;
}
.cli-form-input,.cli-form-select{height:42px;padding:0 10px}
.cli-form-textarea{min-height:82px;padding:9px 10px;resize:vertical}
.cli-form-input:focus,.cli-form-select:focus,.cli-form-textarea:focus{
  border-color:#93df22;box-shadow:0 0 0 2px rgba(147,223,34,.14)
}
.cli-form-tools{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin:6px 0 10px}
.cli-form-btn{
  min-height:42px;border-radius:7px;border:1px solid #4e642c;background:linear-gradient(#182018,#070c08);
  color:#fff;font:900 13px/1 Arial,sans-serif;padding:8px 11px;
}
.cli-form-btn.green{border-color:#74b719;background:linear-gradient(#70bd0a,#347000)}
.cli-form-btn.orange{border-color:#c47a12;background:linear-gradient(#b86f05,#623700)}
.cli-form-btn.blue{border-color:#1f89bd;background:linear-gradient(#167eb3,#06486d)}
.cli-form-btn.red{border-color:#c22b25;background:linear-gradient(#a81812,#550806)}
.cli-form-btn.purple{border-color:#9940a7;background:linear-gradient(#7d258a,#421147)}
.cli-form-hint{color:#93a097;font-size:11px;line-height:1.35;margin-top:-3px;margin-bottom:8px}
.cli-form-switch{display:flex;align-items:center;gap:9px;height:42px}
.cli-form-switch input{width:21px;height:21px;accent-color:#7fcb13}
.cli-address-list{display:grid;gap:8px}
.cli-address-card{
  border:1px solid #334629;border-radius:8px;background:#050d08;padding:10px;display:grid;
  grid-template-columns:1fr auto;gap:10px;align-items:start;
}
.cli-address-card.main{border-color:#79b91a;box-shadow:inset 3px 0 0 #8dd61b}
.cli-address-title{color:#e7ede8;font-size:14px;font-weight:900}
.cli-address-meta{color:#9ba89f;font-size:12px;line-height:1.35;margin-top:4px}
.cli-address-actions{display:flex;flex-direction:column;gap:5px;min-width:120px}
.cli-address-actions button{min-height:31px;font-size:11px;padding:5px}
.cli-form-bottom{
  position:sticky;bottom:0;z-index:60;margin-top:12px;padding:10px;border:1px solid #304127;border-radius:9px;
  background:rgba(2,8,5,.96);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;backdrop-filter:blur(5px)
}
.cli-registry-list{display:grid;gap:6px;margin-top:10px}
.cli-registry-item{
  border:1px solid #405330;background:#07100b;color:#fff;border-radius:8px;padding:10px;text-align:left;min-height:50px
}
.cli-registry-item b{color:#9fe32d}
.cli-form-badge{display:inline-block;border:1px solid #619614;color:#9fe42d;background:#132306;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:900}
@media (max-width:700px){
  /* Celowo NIE zwężamy 941 px — ekran zachowuje czytelność jak DOSTAWCY V12 i może być przesuwany poziomo. */
}


/* ===== V15: KALKULATOR + WALUTY + MAPA GOOGLE ===== */
.v15-screen{
  width:941px;min-width:941px;margin:0;background:#020705;color:#f3f6f3;
  font-family:"Arial Narrow","Roboto Condensed","Noto Sans Condensed",Arial,sans-serif;
  padding-bottom:28px;
}
.v15-head{
  display:grid;grid-template-columns:160px 1fr 160px;align-items:center;
  min-height:92px;padding:13px 16px;border-bottom:1px solid #30422a;
  background:linear-gradient(180deg,#08100d,#020705);
}
.v15-logo{font-size:24px;font-weight:900;color:#e4a11e;line-height:1}
.v15-logo span{display:block;font-size:12px;color:#77c72b;letter-spacing:1.6px;margin-top:5px}
.v15-title{text-align:center;color:#e8a31d;font-size:28px;font-weight:900;line-height:1.05}
.v15-title small{display:block;color:#a5b0a7;font-size:12px;font-weight:600;margin-top:5px}
.v15-back{
  height:46px;border:1px solid #77b725;border-radius:9px;background:#0a140d;color:#fff;
  font-size:18px;font-weight:900
}
.v15-body{padding:16px}
.v15-grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.v15-panel{
  border:1px solid #41542d;border-radius:10px;background:linear-gradient(180deg,#07100c,#020806);
  padding:14px;
}
.v15-panel.full{grid-column:1/-1}
.v15-panel h3{margin:0 0 12px;color:#9de32e;font-size:18px;border-bottom:1px solid #263528;padding-bottom:8px}
.v15-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v15-field{margin-bottom:10px}
.v15-field label{display:block;color:#c5cec7;font-size:12px;font-weight:800;margin:0 0 5px}
.v15-input,.v15-select{
  width:100%;box-sizing:border-box;height:44px;border:1px solid #43582e;border-radius:7px;

.v15-input:focus,.v15-select:focus{border-color:#8fe21c;box-shadow:0 0 0 2px rgba(143,226,28,.14)}
.v15-btn{

  background:linear-gradient(#182019,#080d09);color:#fff;font-size:18px;font-weight:900;
  padding:10px 14px;line-height:1.05;letter-spacing:.15px;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(150,220,30,.25);pointer-events:auto
}
.v15-btn:active{transform:translateY(1px);filter:brightness(1.2)}
#vc_calc{font-size:20px;min-height:58px;box-shadow:0 0 0 1px rgba(151,230,29,.35),0 0 12px rgba(110,190,0,.18)}
.v15-navbig{font-size:22px!important}
.v15-btn.green{border-color:#75bd19;background:linear-gradient(#74bd09,#397700)}
.v15-btn.orange{border-color:#d18b18;background:linear-gradient(#c17808,#6e3f00)}
.v15-btn.blue{border-color:#168ac8;background:linear-gradient(#148bc4,#07557c)}
.v15-btn.red{border-color:#bb3029;background:linear-gradient(#ad1d14,#5b0906)}
.v15-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.v15-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.v15-kpi{border:1px solid #31472a;border-radius:8px;background:#06100b;padding:11px}
.v15-kpi span{display:block;color:#9ba69f;font-size:11px}
.v15-kpi b{display:block;color:#fff;font-size:21px;margin-top:3px}
.v15-kpi b.green{color:#8de526}
.v15-decision{
  margin-top:11px;padding:13px;border-radius:8px;border:1px solid #66a514;background:#142505;
  color:#9be72c;font-size:18px;font-weight:900;text-align:center
}
.v15-table{width:100%;border-collapse:collapse;font-size:13px}
.v15-table th,.v15-table td{padding:9px;border-bottom:1px solid #26382a;text-align:left}
.v15-table th{color:#9de32e;background:#07100c}
.v15-rate-input{width:135px;height:42px;background:#050c08;color:#fff;border:1px solid #40552d;border-radius:7px;padding:0 10px;font-size:17px;font-weight:800}
.v15-note{font-size:12px;color:#98a49b;line-height:1.45;margin-top:8px}
.v15-result{
  padding:15px;border:1px solid #5e8228;border-radius:9px;background:#0b160d;text-align:center;
  font-size:16px
}
.v15-result b{display:block;font-size:30px;color:#9be52b;margin-top:5px}
.v15-dest{
  border:1px solid #405a31;border-radius:10px;background:#06100b;padding:14px;margin-top:10px
}
.v15-dest .name{font-size:20px;font-weight:900;color:#fff}
.v15-dest .kind{color:#9be32d;font-size:12px;font-weight:900;margin-top:3px}
.v15-dest .addr{font-size:16px;color:#e8ede9;margin-top:9px;line-height:1.35}
.v15-map-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.v15-navbig{
  grid-column:1/-1;min-height:58px;font-size:21px;border:1px solid #7dc51b;border-radius:10px;
  background:linear-gradient(#78c70a,#397d00);color:#fff;font-weight:900
}
.v15-status{font-size:12px;color:#a3afa6;margin-top:8px}


/* ===== V18 — TRANSPORT PREMIUM NA OSOBNYM 2. EKRANIE ===== */
.v18-screen{
  width:941px;min-width:941px;min-height:100vh;margin:0;background:#010503;color:#f4f7f4;
  font-family:"Arial Narrow","Roboto Condensed","Noto Sans Condensed",Arial,sans-serif;
}
.v18-top{
  display:grid;grid-template-columns:175px 1fr 170px;align-items:center;
  min-height:102px;padding:14px 18px;border-bottom:1px solid #314525;
  background:
    radial-gradient(circle at 30% 0%,rgba(72,120,12,.14),transparent 40%),
    linear-gradient(180deg,#08100c,#020604);
}
.v18-brand{
  color:#e7a21c;font-size:29px;font-weight:900;line-height:.9;letter-spacing:.2px
}
.v18-brand small{
  display:block;color:#7ed328;font-size:12px;letter-spacing:2px;line-height:1.15;margin-top:8px

.v18-heading{text-align:center}
.v18-heading h1{margin:0;color:#f0aa20;font-size:31px;line-height:1;font-weight:900}

.v18-back{
  min-height:54px;border-radius:9px;border:1px solid #79bd1d;
  background:linear-gradient(#172312,#071007);color:#fff;font-size:18px;font-weight:900;
  cursor:pointer;touch-action:manipulation
}
.v18-back:active{filter:brightness(1.18);transform:translateY(1px)}
.v18-body{padding:18px}
.v18-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.v18-card{
  border:1px solid #40542e;border-radius:12px;
  background:linear-gradient(180deg,#07100c,#020806);
  padding:16px;box-shadow:inset 0 0 0 1px rgba(111,150,73,.05),0 0 18px rgba(0,0,0,.14)
}
.v18-card.full{grid-column:1/-1}
.v18-card h2{
  margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid #263829;
  color:#a8e93a;font-size:22px;font-weight:900
}
.v18-card h2 span{color:#f0aa20}
.v18-section-note{color:#95a198;font-size:12px;line-height:1.4;margin:-5px 0 12px}
.v18-route{
  border:1px solid #2d4328;border-radius:10px;background:#041009;padding:12px;margin-bottom:12px
}
.v18-routehead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.v18-icon{
  width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:25px;background:linear-gradient(#72b20e,#315b00);border:1px solid #8ed31d;flex:0 0 auto
}
.v18-icon.dest{background:linear-gradient(#d2870b,#764500);border-color:#e79d20}
.v18-routehead b{font-size:18px}.v18-routehead small{display:block;color:#97a299;margin-top:2px}
.v18-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v18-field{margin-bottom:10px}
.v18-field label{
  display:block;margin:0 0 6px;color:#c5cec7;font-size:13px;font-weight:900
}
.v18-input,.v18-select{
  width:100%;box-sizing:border-box;height:49px;border-radius:8px;border:1px solid #455d32;
  background:#040b07;color:#fff;padding:0 11px;font-size:17px;font-weight:800;outline:none
}
.v18-input:focus,.v18-select:focus{border-color:#8ddd21;box-shadow:0 0 0 2px rgba(141,221,33,.12)}
.v18-address{
  min-height:40px;margin-top:6px;padding:10px 11px;border-radius:8px;border:1px solid #2d4129;
  background:#09130c;color:#edf1ed;font-size:14px;line-height:1.35
}
.v18-chip{
  display:inline-block;margin-top:7px;padding:5px 8px;border-radius:999px;border:1px solid #43602c;
  background:#0c190c;color:#a9e744;font-size:11px;font-weight:900
}
.v18-actions2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.v18-btn{
  min-height:54px;border-radius:9px;border:1px solid #5d6f3b;color:#fff;
  background:linear-gradient(#1b241d,#080d09);font-size:17px;font-weight:900;
  padding:10px 13px;cursor:pointer;touch-action:manipulation;line-height:1.05
}
.v18-btn:active{filter:brightness(1.18);transform:translateY(1px)}
.v18-btn.green{background:linear-gradient(#79c90a,#397b00);border-color:#8ed51d}
.v18-btn.orange{background:linear-gradient(#d2870c,#7a4600);border-color:#e39a1c}
.v18-btn.blue{background:linear-gradient(#1696cf,#075d86);border-color:#1ba7e6}
.v18-btn.purple{background:linear-gradient(#9b3bd2,#4f156c);border-color:#b75be6}
.v18-btn.gray{background:linear-gradient(#303833,#141916)}
.v18-wide{grid-column:1/-1;font-size:20px;min-height:60px}
.v18-paramgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v18-switchrow{
  margin-top:5px;padding:11px 12px;border:1px solid #33482b;border-radius:9px;
  background:#06110b;display:flex;align-items:center;justify-content:space-between;gap:10px
}
.v18-switchcopy b{display:block;font-size:16px}.v18-switchcopy span{color:#97a198;font-size:12px}
.v18-switch{
  width:64px;height:34px;border-radius:999px;background:#2a332e;border:1px solid #53644f;
  position:relative;cursor:pointer;flex:0 0 auto
}
.v18-switch.on{background:#598f09;border-color:#8ed21e}
.v18-switch i{
  width:26px;height:26px;border-radius:50%;background:#fff;position:absolute;top:3px;left:4px;transition:.15s
}
.v18-switch.on i{left:33px}

.v18-mini span{display:block;color:#96a198;font-size:11px}.v18-mini b{display:block;font-size:19px;margin-top:3px}
.v18-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.v18-kpi{
  min-height:96px;border:1px solid #354c2d;border-radius:10px;background:#06100b;padding:13px

/* ===== V19 — JEDEN STANDARD NACISKANIA PRZYCISKÓW W CAŁYM KALKULATORZE ===== */

/* Android/Chrome nie może już rysować systemowej prostokątnej ramki wokół przycisków. */
button,
button:focus,
button:focus-visible,
.hot,
.hot:focus,
.hot:focus-visible,
.cli-hot,
.cli-hot:focus,
.cli-hot:focus-visible,
.sup-v10 .sup-hot,
.sup-v10 .sup-hot:focus,
.sup-v10 .sup-hot:focus-visible{
  outline:none !important;
  -webkit-tap-highlight-color:transparent !important;
}

/* Niewidzialne strefy przycisków na grafikach MASTER:
   po dotknięciu nie mają ramki — dostają miękkie zielone podświetlenie. */
.hot,
.cli-hot,
.sup-v10 .sup-hot{
  border:0 !important;
  box-shadow:none !important;
  border-radius:10px;
  overflow:hidden;
}

/* Ten sam efekt dla Pulpitu, Ofert, Kalkulatora, Transportu, Rynków EU,
   Walut, Dostawców, Klientów, Mapy, Raportów, Historii i Ustawień. */
.hot:active,
.hot.lm-green-press,
.cli-hot:active,
.cli-hot.lm-green-press,
.sup-v10 .sup-hot:active,
.sup-v10 .sup-hot.lm-green-press{
  outline:none !important;
  border:0 !important;
  background:
    radial-gradient(circle at 50% 42%,rgba(145,235,35,.32) 0%,rgba(100,190,8,.22) 48%,rgba(45,110,0,.12) 72%,rgba(0,0,0,0) 100%) !important;
  box-shadow:
    inset 0 0 22px rgba(137,235,25,.34),
    0 0 14px rgba(102,215,12,.26) !important;
}

/* Normalne przyciski formularzy zachowują swoje kolory.
   Usuwamy jedynie systemową ramkę focus. */
.v15-btn:focus,.v15-btn:focus-visible,
.v18-btn:focus,.v18-btn:focus-visible,
.v18-back:focus,.v18-back:focus-visible,
.cli-form-btn:focus,.cli-form-btn:focus-visible,
.supplier-actions button:focus,.supplier-actions button:focus-visible,
.simple-actions button:focus,.simple-actions button:focus-visible{
